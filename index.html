<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="肥鹅美食街">
  <meta name="mobile-web-app-capable" content="yes">
  <title>肥鹅美食街 - Web 运行</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #000; overflow: hidden;
      user-select: none; -webkit-user-select: none;
      touch-action: none;
    }
    /* 恢复原版 100% 物理像素级高清全屏渲染，彻底消除发糊 */
    canvas {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      display: block;
      z-index: 1;
      touch-action: none;
    }
    /* 外部 DOM GM 默认隐藏，功能完全整合至肥鹅原生侧边栏小箭头 GM 工具中 */
    #gm-toolbar {
      display: none !important;
      position: fixed; top: 20%; right: 0; z-index: 999999;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px; color: #fff;
      display: flex; flex-direction: column; align-items: flex-end;
      touch-action: auto !important;
    }
    #gm-toggle {
      background: rgba(20, 20, 20, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-right: none;
      padding: 8px 10px 8px 12px;
      border-radius: 20px 0 0 20px;
      cursor: pointer;
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      box-shadow: -2px 4px 10px rgba(0,0,0,0.3);
      font-size: 12px; font-weight: 600; color: #f26b1d;
      transition: all 0.2s;
    }
    #gm-toggle:hover { background: rgba(30, 30, 30, 0.95); padding-right: 14px; }
    #gm-panel {
      margin-top: 6px; margin-right: 8px;
      background: rgba(18, 18, 18, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 12px; padding: 12px; display: flex;
      flex-direction: column; gap: 8px; width: 220px;
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }
    #gm-panel.collapsed { display: none; }
    #gm-panel button {
      background: linear-gradient(135deg, #2b5876 0%, #4e4376 100%);
      color: #fff; border: none; padding: 8px 10px;
      border-radius: 6px; font-size: 12px; font-weight: 500;
      cursor: pointer; transition: transform 0.1s, opacity 0.2s;
      touch-action: manipulation;
    }
    #gm-panel button:hover { opacity: 0.9; }
    #gm-panel button:active { transform: scale(0.97); }
        .btn-sm {
      padding: 3px 6px !important;
      font-size: 11px !important;
      border-radius: 4px !important;
      cursor: pointer;
    }
    .btn-primary {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%) !important;
    }
    #gm-panel button.btn-warn {
      background: linear-gradient(135deg, #e53935 0%, #e35d5b 100%);
    }
    .user-info-box {
      background: rgba(255,255,255,0.08); padding: 8px; border-radius: 6px;
      font-size: 12px; display: flex; flex-direction: column; gap: 6px;
    }
    .user-info-row { display: flex; justify-content: space-between; align-items: center; }
    #gm-status { font-size: 11px; color: #a0aec0; text-align: center; margin-top: 2px; }
    @font-face {
      font-family: 'zh-regular';
      src: url('/gamecaches/gameAsset/179256175260614.ttf');
    }
    @font-face {
      font-family: '179256175260614_LABEL';
      src: url('/gamecaches/gameAsset/179256175260614.ttf');
    }
    @font-face {
      font-family: 'zh-bold';
      src: url('/gamecaches/gameAsset/179256175362416.ttf');
    }
    @font-face {
      font-family: '179256175362416_LABEL';
      src: url('/gamecaches/gameAsset/179256175362416.ttf');
    }
    #log {
      position: fixed; left: 0; bottom: 0; right: 0; max-height: 40%; overflow: auto;
      background: rgba(0,0,0,.85); color: #0f0; font: 11px/1.4 monospace; padding: 6px; z-index: 9999;
      white-space: pre-wrap; word-break: break-all; display: none;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <div id="log"></div>

  <!-- 侧边隐藏式开发者工具 (平时只露小药丸，点击滑出，账号与昵称清晰区分) -->
  <div id="gm-toolbar">
    <div id="gm-toggle" onclick="toggleGM()">⚡️ GM 调试</div>
    <div id="gm-panel" class="collapsed">
      <div class="user-info-box">
        <!-- 账号 UID 独立行 -->
        <div class="user-info-row">
          <span style="color:#94a3b8;">账号 UID:</span>
          <b id="player-uid-display" style="color:#f26b1d;font-size:13px;">1001</b>
          <button type="button" class="btn-sm" onclick="toggleSwitchUidForm()">切换账号</button>
        </div>
        <div id="switch-uid-form" style="display:none;margin-top:2px;padding:6px;background:rgba(0,0,0,0.35);border-radius:6px;">
          <div style="font-size:11px;color:#94a3b8;margin-bottom:4px;">输入目标 UID (加载独立云存档):</div>
          <div style="display:flex;gap:4px;">
            <input id="input-switch-uid" type="text" placeholder="如 1002" style="flex:1;min-width:0;background:#0f172a;border:1px solid #334155;color:#fff;padding:4px 6px;border-radius:4px;font-size:12px;">
            <button type="button" class="btn-sm btn-primary" onclick="confirmSwitchUID()">切换</button>
            <button type="button" class="btn-sm" onclick="toggleSwitchUidForm(false)">取消</button>
          </div>
        </div>

        <!-- 角色昵称 独立行 -->
        <div class="user-info-row">
          <span style="color:#94a3b8;">角色昵称:</span>
          <b id="player-name-display" style="color:#38bdf8;font-size:12px;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">肥鹅小厨</b>
          <button type="button" class="btn-sm" onclick="toggleRenameForm()">修改昵称</button>
        </div>
        <div id="rename-form" style="display:none;margin-top:2px;padding:6px;background:rgba(0,0,0,0.35);border-radius:6px;">
          <div style="font-size:11px;color:#94a3b8;margin-bottom:4px;">输入新昵称 (不影响进度):</div>
          <div style="display:flex;gap:4px;">
            <input id="input-new-name" type="text" placeholder="新名字" style="flex:1;min-width:0;background:#0f172a;border:1px solid #334155;color:#fff;padding:4px 6px;border-radius:4px;font-size:12px;">
            <button type="button" class="btn-sm btn-primary" onclick="confirmRename()">保存</button>
            <button type="button" class="btn-sm" onclick="toggleRenameForm(false)">取消</button>
          </div>
        </div>

        <div class="user-info-row">
          <span style="color:#94a3b8;">云端状态:</span>
          <span id="sync-status-text" style="color:#4ade80;">☁️ 已连接</span>
        </div>
      </div>
      <button onclick="window.openMailWindow && window.openMailWindow()">✉️ 打开系统信箱</button>
      <button onclick="window.__gmRefillEnergy()">⚡️ 体力回满(+100)</button>
      <button onclick="window.__gmAddDiamond(1000)">💎 加钻石(+1000)</button>
      <button class="btn-warn" onclick="window.__gmResetProgress()">🔄 清除进度重开 (测新手引导)</button>
      <div id="gm-status">状态: 游戏中</div>
    </div>
  </div>

  <script>
    // 在任何 adapter 加载前锁定原生 DOM 操作引用
    window.__nativeGetElementById = document.getElementById.bind(document);
    window.__nativeQuerySelector = document.querySelector.bind(document);
    function getDom(id) {
      return (window.__nativeGetElementById || document.getElementById.bind(document))(id);
    }
    window.getDom = getDom;

    function getStoredUID() {
      try {
        var urlParams = new URLSearchParams(location.search);
        var qUid = urlParams.get('uid');
        if (qUid && qUid.trim()) {
          var cleanUid = qUid.trim();
          localStorage.setItem('fe_player_uid', cleanUid);
          return cleanUid;
        }
      } catch (e) {}
      var uid = localStorage.getItem('fe_player_uid');
      if (!uid || !uid.trim()) {
        uid = '1001';
        localStorage.setItem('fe_player_uid', uid);
      }
      return uid;
    }
    function updateUIDDisplay(uid) {
      var el = getDom('player-uid-display');
      if (el) el.innerText = uid || '1001';
    }
    window.getCurrentPlayerUID = function () {
      return getStoredUID();
    };
    window.__updateCloudSyncStatus = function (status) {
      var txt = getDom('sync-status-text');
      if (!txt) return;
      if (status === 'syncing') {
        txt.innerText = '☁️ 同步中...';
      } else if (status === 'synced') {
        txt.innerText = '☁️ 已同步';
      } else if (status === 'offline') {
        txt.innerText = '本地离线';
      } else if (status === 'error') {
        txt.innerText = '同步异常';
      }
    };
    function toggleSwitchUidForm(show) {
      var f = getDom('switch-uid-form');
      if (!f) return;
      if (show === undefined) show = f.style.display === 'none';
      f.style.display = show ? 'block' : 'none';
      if (show) {
        var inp = getDom('input-switch-uid');
        if (inp) { inp.value = getStoredUID(); inp.focus(); }
      }
    }
    function confirmSwitchUID() {
      var inp = getDom('input-switch-uid');
      var uid = (inp && inp.value || '').trim();
      if (!uid) { alert('请输入有效 UID'); return; }
      localStorage.setItem('fe_player_uid', uid);
      updateUIDDisplay(uid);
      location.reload();
    }

    function toggleRenameForm(show) {
      var f = getDom('rename-form');
      if (!f) return;
      if (show === undefined) show = f.style.display === 'none';
      f.style.display = show ? 'block' : 'none';
      if (show) {
        var inp = getDom('input-new-name');
        var curName = getStoredNickname();
        if (inp) { inp.value = curName; inp.focus(); }
      }
    }
    function getStoredNickname() {
      if (window.role && window.role.userInfo && (window.role.userInfo.nickName || window.role.userInfo.name)) {
        return window.role.userInfo.nickName || window.role.userInfo.name;
      }
      return localStorage.getItem('fe_player_nickname') || '肥鹅小厨';
    }
    function updateNicknameDisplay(name) {
      var el = getDom('player-name-display');
      if (el) el.innerText = name || '肥鹅小厨';
    }
    function confirmRename() {
      var inp = getDom('input-new-name');
      var name = (inp && inp.value || '').trim();
      if (!name) { alert('请输入有效昵称'); return; }
      localStorage.setItem('fe_player_nickname', name);
      if (window.role && window.role.userInfo) {
        window.role.userInfo.name = name;
        window.role.userInfo.nickName = name;
      }
      updateNicknameDisplay(name);
      toggleRenameForm(false);
      var st = getDom('gm-status');
      if (st) st.textContent = '昵称已保存为: ' + name;
      if (window.__triggerCloudSave) window.__triggerCloudSave();
    }
    window.updateNicknameDisplay = updateNicknameDisplay;
    window.confirmRename = confirmRename;
    window.toggleRenameForm = toggleRenameForm;
    window.confirmSwitchUID = confirmSwitchUID;
    window.toggleSwitchUidForm = toggleSwitchUidForm;

    function toggleGM() {
      var p = getDom('gm-panel');
      if (p) p.classList.toggle('collapsed');
    }
    window.toggleGM = toggleGM;
    window.__gmSkipComic = function () {
      var st = document.getElementById('gm-status');
      var w = cc.find("Canvas/UIRoot/WINDOW/ComicWindow_0_OPEN");
      if (w && w.getComponent("ComicWindow")) {
        var comp = w.getComponent("ComicWindow");
        for (var i = 0; i < 6; i++) {
          try { comp.onClickContinue(); } catch(e){}
        }
        if (window.lp) window.lp.updateCondition("ComicEnd", 1);
        if (st) st.textContent = '已跳过漫画';
      } else {
        if (st) st.textContent = '当前不在漫画窗口';
      }
    };
    window.__gmGoToMainBoard = function () {
      var st = document.getElementById('gm-status');
      if (st) st.textContent = '正在进入主大棋盘...';
      if (window.C3 && window.Ci) {
        try { window.C3.SwitchTo(window.Ci.MergeScreen); } catch(e){}
      }
      if (window.lp) {
        window.lp.curGuideId = 'Merge';
        window.lp.curStepId = 1002;
      }
      // 1. Advance comic if open
      for (var i = 0; i < 8; i++) {
        var w = cc.find("Canvas/UIRoot/WINDOW/ComicWindow_0_OPEN");
        if (w && w.getComponent("ComicWindow")) {
          try { w.getComponent("ComicWindow").onClickContinue(); } catch(e){}
        }
      }
      // 2. Loop check and ensure MergeScreen
      var count = 0;
      var timer = setInterval(function () {
        count++;
        if (window._board_renderer_ && window._board_renderer_.mergeBoardData) {
          clearInterval(timer);
          if (st) st.textContent = '已成功进入第1天主大棋盘！';
          return;
        }
        var w = cc.find("Canvas/UIRoot/WINDOW/ComicWindow_0_OPEN");
        if (w && w.getComponent("ComicWindow")) {
          try { w.getComponent("ComicWindow").onClickContinue(); } catch(e){}
        }
        if (window.C3 && window.Ci && window.C3.currentScreen !== window.Ci.MergeScreen) {
          try { window.C3.SwitchTo(window.Ci.MergeScreen); } catch(e){}
        }
        if (window.lp) {
          window.lp.curGuideId = 'Merge';
          window.lp.curStepId = 1002;
        }
        if (count > 50) {
          clearInterval(timer);
          if (st) st.textContent = '直达结束';
        }
      }, 200);
    };
    // 测试补给:总循环实测常被体力卡住(2 小时自然恢复),一键回满+发钻(只改活体
    //role+落档,数值照 mock 惯例直接写 role 字段——服务器权威数据的"代服务器发奖")
    // 仅增加钻石(不碰金币)
    window.__gmAddDiamond = function (amount) {
      var num = Number(amount) || 1000;
      var st = document.getElementById('gm-status');
      var r = window._user_mgr_ && window._user_mgr_.role;
      if (!r) { if (st) st.textContent = 'role 未就绪'; return; }
      r.diamond = (r.diamond || 0) + num;
      try { window.__mockSaveNow(); } catch (e) {}
      if (st) st.textContent = '💎 钻石已增加 +' + num + ' (当前: ' + r.diamond + ')，金币未受影响';
      console.log('[GM] 钻石 +' + num + ', 当前总钻石: ' + r.diamond);
      return r.diamond;
    };

    // 仅恢复体力
    window.__gmRefillEnergy = function () {
      var st = document.getElementById('gm-status');
      var r = window._user_mgr_ && window._user_mgr_.role;
      if (!r) { if (st) st.textContent = 'role 未就绪'; return; }
      if (r.energy && r.energy.valueMax) {
        r.energy.value = r.energy.valueMax;
      }
      try { window.__mockSaveNow(); } catch (e) {}
      if (st) st.textContent = '⚡️ 体力已回满: ' + (r.energy ? r.energy.value : 0);
      console.log('[GM] 体力已回满');
    };

    // 原 __gmRefill 保持兼容，但彻底移除加金币逻辑，只加钻石和体力
    window.__gmRefill = function () {
      window.__gmRefillEnergy();
      window.__gmAddDiamond(1000);
    };

    // 一键瞬间完成做菜 (所有锅里的菜立即熟透)
    window.__gmInstantCook = function () {
      var st = document.getElementById('gm-status');
      var r = window._user_mgr_ && window._user_mgr_.role;
      if (!r || !r.boards) { if (st) st.textContent = 'role 未就绪'; return; }
      var b = r.boards.get ? r.boards.get(1) : r.boards[1] || r.boards[0];
      if (!b || !b.cells) { if (st) st.textContent = '棋盘未就绪'; return; }
      var count = 0;
      var now = Date.now();
      b.cells.forEach(function (c) {
        if (c && c.order && c.order.state >= 2) {
          c.order.endTime = now - 1000;
          c.order.state = 3; // ir.complete
          count++;
        }
      });
      try { window.__mockSaveNow(); } catch (e) {}
      if (st) st.textContent = '🍳 已将 ' + count + ' 道正在烹饪的菜品置为完成！点击锅即可取菜';
      console.log('[GM] 已将 ' + count + ' 道菜品瞬间完成');
    };

    window.__gmResetProgress = function () {
      if (confirm('确定要清除本地全部存档并重新开始吗？')) {
        // 三步:①停存标志——否则 reload 的 beforeunload 会把内存活体 role 强存回去,
        //旧档还魂;②双清 localStorage(adapter 层+原生层,SAVE_KEY 在原生);③重载
        window.__suppressMockSave = true;
        try { localStorage.clear(); } catch (e) {}
        try {
          var nls = window.__nativeLocalStorage || window.localStorage;
          nls.clear();
        } catch (e) {}
        location.reload();
      }
    };
  </script>
  <script>
    // 保存原生 DOM 查询方法(防止 weapp-adapter 覆写 document.getElementById)
    window.__realGetElementById = document.getElementById.bind(document);
    window.__realQuerySelector = document.querySelector.bind(document);
    // 此刻一切 adapter 尚未加载,这是纯原生 localStorage 引用(重置按钮双清用)
    window.__nativeLocalStorage = window.localStorage;

    // 告警洪水治理:拦截 game.js 里残留的 ">>>" 资源加载调试日志(排查期注入的),
    // 每次刷新数千条黄色警告会淹没真问题;URL 带 ?debug 可恢复全部输出
    window.__DEBUG__ = /[?&]debug/.test(location.search);

    // 页面内日志(尽量健壮:先存数组,再尝试写 DOM)
    var __logs = [];
    window.__logs = __logs;
    window.__errs = [];
    function __sendReport(type, detail) {
      try {
        if (typeof fetch === 'function') {
          var payload = {
            type: type,
            detail: detail,
            href: location.href,
            dpr: window.devicePixelRatio,
            screen: [screen.width, screen.height],
            viewport: [window.innerWidth, window.innerHeight]
          };
          fetch('/api/report', {
            method: 'POST',
            keepalive: true,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          }).catch(function () {});
        }
      } catch (e) {}
    }
    window.__sendReport = __sendReport;

    function __log() {
      var args = Array.prototype.slice.call(arguments).map(function (a) {
        try { return typeof a === 'string' ? a : JSON.stringify(a); } catch (e) { return String(a); }
      });
      __logs.push(args.join(' '));
      try {
        var el = document.getElementById('log');
        el.textContent = __logs.slice(-200).join('\n');
      } catch (e) {}
      try { (console.log || function () {}).apply(console, arguments); } catch (e) {}
    }
    window.addEventListener('error', function (e) {
      var msg = '[window.error] ' + e.message + ' @ ' + (e.filename||'') + ':' + e.lineno + ':' + e.colno;
      __errs.push(msg);
      if (e.error && e.error.stack) __errs.push(e.error.stack.split('\n').slice(0, 25).join('\n'));
      __log('[window.error]', e.message, '@', e.filename, e.lineno, e.colno);
      __sendReport('js_error', { message: e.message, filename: e.filename, lineno: e.lineno, stack: e.error && e.error.stack });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var msg = (e.reason && (e.reason.message || e.reason)) || '';
      // 过滤浏览器扩展(如翻译插件、广告拦截、密码管理器等)与后台通信通道关闭引起的已知外部误报
      if (typeof msg === 'string' && msg.includes('message channel closed before a response was received')) {
        if (e.preventDefault) e.preventDefault();
        return;
      }
      __errs.push('[unhandledrejection] ' + msg);
      __log('[unhandledrejection]', e.reason);
      __sendReport('unhandled_promise', { reason: String(e.reason) });
    });
  </script>


  <!-- 1. AMD loader -->
  <script src="loader.js"></script>
  <!-- 2. wx polyfill -->
  <script src="wx-polyfill.js"></script>
  <!-- 2.5 mock-network for Orange RPC (带版本戳击碎浏览器与CDN缓存) -->
  <script src="mock-network.js?v=20261028_perf_v2"></script>
  <script>
    // 微信小游戏全局对象(浏览器里即 window)
    window.GameGlobal = window;
    // 3. 分包 URL 映射(供 wx.loadSubpackage 动态加载)
    window.__SUBPACKAGE_URLS__ = {
      main: 'subpackages_main.js',
      miniGame: 'subpackages_miniGame.js'
    };
    __log('[boot] loader + wx-polyfill 已就绪');
  </script>
  <!-- 4. 预加载 config + 主包执行 -->
  <script>
    // 预加载所有同步读取的 config 到 fsStore(readJsonSync 依赖)
    function preloadText(path) {
      return fetch('/' + path).then(function (r) {
        if (!r.ok) throw new Error('404');
        return r.text();
      }).then(function (txt) {
        window.__fsPreload(path, txt);
        __log('[preload] ' + path + ' ok (' + txt.length + ')');
      }).catch(function (e) { __log('[preload] ' + path + ' 失败: ' + e.message); });
    }
    function preloadBuffer(path, aliasPaths) {
      return fetch('/' + path).then(function (r) {
        if (!r.ok) throw new Error('404 ' + path);
        return r.arrayBuffer();
      }).then(function (buf) {
        window.__fsPreload(path, buf);
        (aliasPaths || []).forEach(function (a) { window.__fsPreload(a, buf); });
        __log('[preload buffer] ' + path + ' ok (' + buf.byteLength + ')');
