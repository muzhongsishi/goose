<!DOCTYPE html><html><head><meta charset="utf8"></head><body style="margin:0;background:#f00">
<script>
var c = document.createElement('canvas'); c.width=200; c.height=200; document.body.appendChild(c);
var gl = c.getContext('webgl');
if(!gl){ document.body.innerHTML = 'NO WEBGL'; } else {
  gl.clearColor(0,0,1,1); gl.clear(gl.COLOR_BUFFER_BIT);
  document.body.appendChild(document.createTextNode('GL OK'));
}
</script></body></html>
